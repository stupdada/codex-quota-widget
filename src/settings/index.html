<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灯效设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header>
        <h1>额度灯效与用量</h1>
        <p id="statusText">灯效只由 5h / 7d 额度状态决定</p>
      </header>

      <section class="field">
        <label for="warningBreathInput">额度告警呼吸周期（秒）</label>
        <div class="control-row">
          <input id="warningBreathRange" type="range" min="1" max="20" step="0.5" />
          <input id="warningBreathInput" type="number" min="1" max="20" step="0.5" />
        </div>
      </section>

      <section class="field">
        <label for="criticalInput">接近耗尽闪烁</label>
        <div class="control-row">
          <input id="criticalRange" type="range" min="1" max="20" step="0.5" />
          <input id="criticalInput" type="number" min="1" max="20" step="0.5" />
        </div>
      </section>

      <section class="field">
        <label for="quotaRefreshInput">额度刷新间隔</label>
        <div class="control-row">
          <input id="quotaRefreshRange" type="range" min="1" max="30" step="1" />
          <input id="quotaRefreshInput" type="number" min="1" max="30" step="1" />
        </div>
      </section>

      <section class="field">
        <label for="usageRangeSelect">展开态美元用量范围</label>
        <select id="usageRangeSelect">
          <option value="cycle_5h">当前 5h 周期</option>
          <option value="cycle_7d">当前 7d 周期</option>
          <option value="last_3h">最近 3 小时</option>
          <option value="today">今天</option>
          <option value="week">本周</option>
        </select>
      </section>

      <footer>
        <button id="resetBtn" type="button" class="secondary">恢复默认</button>
        <button id="saveBtn" type="button">保存</button>
      </footer>
    </main>
    <script src="./settings.js"></script>
  </body>
</html>
