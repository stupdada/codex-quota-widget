<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex 用量监控悬浮窗</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-state="loading" data-view="compact" data-compact-display="hud" data-compact-expanded="false">
    <main class="widget">
      <section id="compactShell" class="compact-shell" aria-label="Codex 用量监控悬浮窗">
        <div id="compactHud" class="compact-hud" aria-label="7天窗口和5小时窗口剩余额度">
          <div class="compact-hud-glow compact-hud-glow-weekly" aria-hidden="true"></div>
          <div class="compact-hud-glow compact-hud-glow-short" aria-hidden="true"></div>
          <div class="compact-hud-shine" aria-hidden="true"></div>
          <div id="compactQuotaSignal" class="compact-quota-signal quota-unavailable" title="额度不可用" aria-label="额度不可用"></div>

          <div class="compact-metric compact-metric-weekly">
            <div class="compact-metric-copy">
              <span class="compact-metric-label">7d</span>
              <strong id="compactWeeklyText">--</strong>
              <span id="compactWeeklyDelta" class="compact-delta neutral">--</span>
            </div>
            <div class="compact-track" aria-hidden="true">
              <div id="compactWeeklyFill" class="compact-track-fill"></div>
              <div id="compactWeeklyIdeal" class="compact-ideal-marker"></div>
              <span id="compactWeeklyIdealText" class="compact-ideal-text">--</span>
            </div>
          </div>

          <div class="compact-divider" aria-hidden="true"></div>

          <div class="compact-metric compact-metric-short">
            <div class="compact-metric-copy">
              <span class="compact-metric-label">5h</span>
              <strong id="compactShortText">--</strong>
              <span id="compactShortDelta" class="compact-delta neutral">--</span>
            </div>
            <div class="compact-track" aria-hidden="true">
              <div id="compactShortFill" class="compact-track-fill"></div>
              <div id="compactShortIdeal" class="compact-ideal-marker"></div>
              <span id="compactShortIdealText" class="compact-ideal-text">--</span>
            </div>
          </div>
        </div>

        <div id="compactControls" class="compact-controls">
          <button id="compactThemeBtn" class="compact-control-button compact-theme-button" title="切换 HUD 主题" aria-label="切换 HUD 主题">岛</button>
          <button id="compactDashboardBtn" class="compact-control-button" title="打开 Token 仪表盘" aria-label="打开 Token 仪表盘">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5M9 9 4 4M15 9l5-5M9 15l-5 5M15 15l5 5" />
            </svg>
          </button>
          <button id="compactCloseBtn" class="compact-control-button danger" title="隐藏到托盘" aria-label="隐藏到托盘">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <div id="compactQuotaStatus" class="compact-advice muted" aria-live="polite">
          <span id="compactStatusKicker" class="compact-advice-kicker">状态</span>
          <span id="compactStatusValue" class="compact-advice-value">不可用</span>
        </div>

        <div id="compactResetInfo" class="compact-reset-info" aria-label="额度详情">
          <div class="compact-reset-row compact-reset-weekly">
            <strong>7d</strong>
            <span class="compact-reset-label">重置时间</span>
            <span id="compactWeeklyResetText" class="compact-detail-reset">--</span>
          </div>
          <div class="compact-reset-row compact-reset-short">
            <strong>5h</strong>
            <span class="compact-reset-label">重置时间</span>
            <span id="compactShortResetText" class="compact-detail-reset">--</span>
          </div>
          <div class="compact-reset-row compact-usage-row">
            <strong id="compactUsageLabel">5h</strong>
            <span class="compact-reset-label">用量</span>
            <span id="compactUsageValue" class="compact-detail-reset">--</span>
          </div>
        </div>

        <div id="compactStripUsage" class="compact-strip-usage" aria-live="polite">5h 用量 --</div>
        <button id="compactResizeHandle" class="compact-resize-handle" title="缩放" aria-label="缩放"></button>
      </section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
